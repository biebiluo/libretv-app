name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build unsigned app
        run: |
          xcodebuild -project LibreTV.xcodeproj -scheme LibreTV -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/LibreTV.app Payload/
          zip -r LibreTV.ipa Payload
          ls -lh LibreTV.ipa
          unzip -l LibreTV.ipa | head -30
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreTV-ipa
          path: LibreTV.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" LibreTV.ipa --title "LibreTV build ${{ github.run_number }}" --notes "LibreTV 套壳版，未签名 IPA，可用直装工具安装测试。首次打开需粘贴服务器地址。"
